name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The Prisma client is typed from the schema; typecheck and the api build need it generated.
      - run: npm run prisma:generate
      # Next 16 types the routes into .next before tsc can see them.
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run lint
      - run: npm run check:copy
      # Logical utilities, token colours, no new stylesheet (ADR 0022); --self-test runs first.
      - run: npm run check:styles
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run build
      # The measure job reads this build of the web instead of building it again (speed plan PF.14). An upload that
      # fails never fails this job: the measure job then builds on its own.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: web-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  # Specs that need a real PostgreSQL (row locks, transactions) are named *.db.spec.ts and skip without
  # TEST_DATABASE_URL. This job gives them one: a throwaway postgres service with the migrations applied.
  # The outbox relay's queue specs also need Redis (TEST_REDIS_URL): a throwaway redis service beside it.
  db:
    name: api specs on postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smilesim
          POSTGRES_PASSWORD: smilesim
          POSTGRES_DB: smilesim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smilesim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smilesim:smilesim@localhost:5432/smilesim_test
      TEST_DATABASE_URL: postgresql://smilesim:smilesim@localhost:5432/smilesim_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm test --workspace api -- '\.db\.spec\.ts$'

  # Playwright runs the web app against a mock api in a real browser.
  # continue-on-error is deliberate for now: these tests have never run in CI, and a browser,
  # font download, or timing difference there must not block merges while we learn how stable
  # they are. The job still runs and reports; remove continue-on-error to make it a required gate
  # once it has been green on main for a while.
  e2e:
    name: e2e (playwright, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm test --workspace web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Production figures for the web (speed plan PF.14, spec decision 15), written to the job summary: first-load JS a
  # route and the largest chunks from the build above, then Lighthouse on the sign-in page and one signed-in page
  # (`next start` against the e2e mock API). It measures and never gates: continue-on-error, and no job needs it.
  # Budgets that fail a merge come later, once the numbers have settled.
  measure:
    name: measure (production build, non-blocking)
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        id: build
        continue-on-error: true
        with:
          name: web-build
          path: apps/web/.next
      # The same build the verify job makes (no NEXT_PUBLIC_API_URL: the /api rewrite goes to 127.0.0.1:3001).
      - name: Build the web when the verify job left no build
        if: ${{ steps.build.outcome != 'success' || hashFiles('apps/web/.next/BUILD_ID') == '' }}
        working-directory: apps/web
        run: npx next build
      - name: Route sizes and the largest chunks
        working-directory: apps/web
        run: node scripts/measure.mjs bundle .next >> "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse on the sign-in page and the numbers list
        id: lighthouse
        continue-on-error: true
        working-directory: apps/web
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse"
          # The mock answers on the API's own port, where the build's /api rewrite points.
          MOCK_API_PORT=3001 MOCK_WEB_ORIGIN=http://admin.localhost:3910 node tests/mock-api.mjs > "$RUNNER_TEMP/lighthouse/mock-api.log" 2>&1 &
          npx next start -p 3910 > "$RUNNER_TEMP/lighthouse/next-start.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3910/login && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run() {
            npx --yes lighthouse@13 "$1" --quiet --only-categories=performance \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output=html --output-path="$RUNNER_TEMP/lighthouse/$2" "${@:3}" || true
          }
          # A door host, as a browser opens it; the signed-in page is the mock's branch session (the cookie the
          # e2e numbers spec sets).
          run http://pos.localhost:3910/login sign-in
          run http://admin.localhost:3910/numbers numbers --extra-headers='{"Cookie":"mock-branch=1"}'
      - name: Lighthouse figures
        if: ${{ always() && steps.lighthouse.outcome != 'skipped' }}
        working-directory: apps/web
        run: |
          node scripts/measure.mjs lighthouse \
            "sign-in=$RUNNER_TEMP/lighthouse/sign-in.report.json" \
            "numbers, signed in=$RUNNER_TEMP/lighthouse/numbers.report.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: ignore
          retention-days: 7
