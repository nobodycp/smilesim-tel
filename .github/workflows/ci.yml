name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Prisma client is typed from the schema; typecheck and the api build need it generated.
      - run: npm run prisma:generate
      # Next 16 types the routes into .next before tsc can see them.
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run lint
      - run: npm run check:copy
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run build

  # Specs that need a real PostgreSQL (row locks, transactions) are named *.db.spec.ts and skip without
  # TEST_DATABASE_URL. This job gives them one: a throwaway postgres service with the migrations applied.
  db:
    name: api specs on postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smilesim
          POSTGRES_PASSWORD: smilesim
          POSTGRES_DB: smilesim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smilesim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smilesim:smilesim@localhost:5432/smilesim_test
      TEST_DATABASE_URL: postgresql://smilesim:smilesim@localhost:5432/smilesim_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm test --workspace api -- '\.db\.spec\.ts$'

  # Playwright runs the web app against a mock api in a real browser.
  # continue-on-error is deliberate for now: these tests have never run in CI, and a browser,
  # font download, or timing difference there must not block merges while we learn how stable
  # they are. The job still runs and reports; remove continue-on-error to make it a required gate
  # once it has been green on main for a while.
  e2e:
    name: e2e (playwright, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm test --workspace web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
