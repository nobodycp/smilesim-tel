# One file for Coolify and for local runs. The api image runs with NODE_ENV=production, and a production api does
# not start until its settings are safe (apps/api/src/production-config.ts, ADR 0016). Coolify sets:
#   the cookie domain = the parent domain shared by web and api (never set locally)
#   COOKIE_SECURE = true
#   WEB_ORIGIN = the public web URL(s), https, comma-separated (the browser origins the api allows, with cookies)
#   TRUST_PROXY = the number of reverse proxies between the browser and the api (0 when there is none). Count them
#     on the real deployment; the api does not guess.
#   NEXT_PUBLIC_API_URL = the public api URL (a build argument of web)
#   SECRETS_KEY = 32 random bytes, base64 (`openssl rand -base64 32`); seals authenticator secrets.
#     After setting it once: `npm run seal-secrets --workspace api`.
#     Losing it locks authenticator users out (the owner can clear 2FA per account).
# Provider operations are never simulated in production: every operation becomes a branch task.
#
# Trial accounts (branch/main/agent/pos with the published password 123456) are OFF here.
# TRIAL_SEED and TRIAL_SEED_ALLOW_PRODUCTION default to false, so a deployment that reads
# only this file (Coolify) never creates them. Local `docker compose up` turns them on through
# docker-compose.override.yml, which Compose loads by itself and Coolify does not.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser calls same-origin /api; Next rewrites to the api service on the compose network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    expose:
      - "3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: smilesim-api
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    expose:
      - "3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://smilesim:smilesim@postgres:5432/smilesim}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PROVIDER_SIMULATION: ${PROVIDER_SIMULATION:-}
      TRIAL_SEED: ${TRIAL_SEED:-false}
      TRIAL_SEED_ALLOW_PRODUCTION: ${TRIAL_SEED_ALLOW_PRODUCTION:-false}
    depends_on:
      - postgres
      - redis

  worker:
    # Built from the api Dockerfile under the same tag as api, so the web image is never involved.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: smilesim-api
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://smilesim:smilesim@postgres:5432/smilesim}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # The same key as the api: the worker settles eSIM activations, whose codes are stored sealed. A production
      # worker does not start without it (ADR 0019, S.12b.0). This line reaches a worker only where this file is
      # what is deployed. Where the worker is an application of its own (the Coolify deployment of today: three
      # Dockerfile applications), the key must be set in THAT application's environment: nothing here does it.
      SECRETS_KEY: ${SECRETS_KEY:-}
    depends_on:
      - api
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smilesim
      POSTGRES_PASSWORD: smilesim
      POSTGRES_DB: smilesim
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
