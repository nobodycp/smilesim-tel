# LOCAL DEVELOPMENT ONLY. `docker compose up` merges this file into docker-compose.yml by itself.
# A Coolify deployment never reads this file: keep it that way. (The deployment that exists today is not a
# Compose resource at all: it is three Dockerfile applications, each with its own environment variables; see
# docs/handover/technical-operations-ar.md, section 4.)
#
# It turns the trial accounts on (branch, main, agent, pos; password 123456) so a fresh local
# database has a way in, and runs the api image as a development copy: a production api refuses
# trial accounts, plain-HTTP cookies and simulated providers (apps/api/src/production-config.ts).
# The trial flags can be overridden from .env (see .env.example).
services:
  web:
    ports:
      - "3000:3000"
  api:
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      TRIAL_SEED: ${TRIAL_SEED:-true}
      TRIAL_SEED_ALLOW_PRODUCTION: ${TRIAL_SEED_ALLOW_PRODUCTION:-true}
  # The worker too is a development copy here: a production worker does not start without SECRETS_KEY.
  worker:
    environment:
      NODE_ENV: development
  # The local copy runs the API from source (scripts/dev-local.sh): it reaches the data containers on these ports,
  # bound to this machine only.
  postgres:
    ports:
      - "127.0.0.1:55432:5432"
  redis:
    ports:
      - "127.0.0.1:56379:6379"
